<!doctype html><html lang="cs"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#FFFFFF;padding:20px 22px;font-family:var(--font-body)}.lb{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.hx{font-family:var(--font-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.p{font-size:13px;color:var(--muted);line-height:1.5}</style></head><body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px">
<div style="background:#FFFFFF;border:1px solid var(--rule);border-radius:12px;padding:14px"><div style="color:var(--muted);font-size:15px">Muted on paper</div><div class="hx" style="margin-top:6px">#4A6884 · 6.9:1</div></div>
<div style="background:#F2F6FA;border:1px solid var(--rule);border-radius:12px;padding:14px"><div style="color:var(--muted);font-size:15px">Muted on band</div><div class="hx" style="margin-top:6px">#4A6884 · 6.4:1</div></div>
<div style="background:#0F3557;border-radius:12px;padding:14px"><div style="color:#A6C2DB;font-size:15px">Muted on dark</div><div class="hx" style="margin-top:6px;color:#A6C2DB">#A6C2DB · 7.2:1</div></div>
</div>
<div style="display:flex;gap:14px;align-items:center;margin-top:16px"><span class="pill" style="min-height:56px;padding:0 24px;font-size:16px">56 px</span><span class="pill pill-sm" style="font-size:15px">46 px</span><span style="display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:1px dashed var(--accent);border-radius:8px" class="hx">44</span><span class="p">minimum hit target; focus ring 2px at 3px offset</span></div></body></html>
