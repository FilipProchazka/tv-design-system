<!doctype html><html lang="cs"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#FFFFFF;padding:20px 22px;font-family:var(--font-body)}.lb{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.hx{font-family:var(--font-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}</style></head><body><div style="font-family:var(--font-display);font-weight:300;font-size:76px;line-height:1.06;letter-spacing:-.028em;color:var(--ink)">ď ť ě š č ř ž ů</div>
<p style="margin-top:14px;font-size:13px;color:var(--muted);line-height:1.55;max-width:66ch">Epilogue crowds the háček-apostrophe on <b style="font-weight:600">ď</b> and <b style="font-weight:600">ť</b> against the ascender at claim sizes, and its carons thin out at 74–100px. Geist keeps the same narrow geometric skeleton and weight 300 while drawing both with clearance.</p></body></html>
