<!doctype html><html lang="cs"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#FFFFFF;padding:20px 22px;font-family:var(--font-body)}.lb{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.hx{font-family:var(--font-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}</style></head><body><div style="display:flex;gap:20px;align-items:flex-start">
