<!doctype html><html lang="cs"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#FFFFFF;padding:20px 22px;font-family:var(--font-body)}.lb{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.hx{font-family:var(--font-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}</style></head><body><div style="display:flex;gap:0;border-radius:12px;overflow:hidden;border:1px solid var(--rule)">
<div style="flex:1;background:#FFFFFF;padding:20px 16px"><div class="lb">0 · Paper</div><div class="hx" style="margin-top:6px">#FFFFFF</div></div>
<div style="flex:1;background:#F2F6FA;padding:20px 16px"><div class="lb">1 · Band</div><div class="hx" style="margin-top:6px">#F2F6FA</div></div>
<div style="flex:1;background:#F2F6FA;padding:20px 16px"><div style="background:#FFF;border:1px solid #AFC4D6;border-radius:10px;padding:12px 12px"><div class="lb">2 · Card</div><div class="hx" style="margin-top:6px">#FFFFFF</div></div></div>
<div style="flex:1;background:#0F3557;padding:20px 16px;color:#FFF"><div class="lb" style="color:#A6C2DB">3 · Dark</div><div class="hx" style="margin-top:6px;color:#A6C2DB">#0F3557</div></div>
</div><p style="margin-top:14px;font-size:13px;color:var(--muted);line-height:1.5">An accent never sits directly on the page ground without one of these under it. Level 3 is punctuation, not a mode.</p></body></html>
