<!doctype html><html lang="cs"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#FFFFFF;padding:20px 22px;font-family:var(--font-body)}.lb{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.hx{font-family:var(--font-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
<div style="position:relative;border-radius:14px;overflow:hidden;aspect-ratio:16/7"><img src="../assets/img/band-lift.jpg" alt="" style="width:100%;height:100%;object-fit:cover"><div style="position:absolute;inset:0;background-image:linear-gradient(180deg,rgba(15,53,87,0) 40%,rgba(15,53,87,.26));display:flex;align-items:center;justify-content:center"><span style="font-family:var(--font-display);font-size:24px;color:#FFF">Gradient only</span></div></div>
<div style="position:relative;border-radius:14px;overflow:hidden;aspect-ratio:16/7"><img src="../assets/img/band-lift.jpg" alt="" style="width:100%;height:100%;object-fit:cover"><div class="scrim" style="display:flex;align-items:center;justify-content:center"><span style="font-family:var(--font-display);font-size:24px;color:#FFF">Real scrim</span></div></div>
</div>
<p style="margin-top:14px;font-size:13px;color:var(--muted);line-height:1.5">Left computes as a transparent background-colour, so a contrast tool measures the band behind the photograph. Right carries <span class="hx">rgba(15,53,87,.50)</span> under the gradient, so what is measured is what is seen.</p></body></html>
