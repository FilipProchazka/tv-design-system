<!-- @dsCard group="Colors" viewport="700x230" name="Semantic roles" subtitle="Canonical names alias the working short names" -->
<!doctype html><html lang="cs"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#FFFFFF;padding:20px 22px;font-family:var(--font-body)}.lb{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.hx{font-family:var(--font-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.p{font-size:13px;color:var(--muted);line-height:1.5}</style></head><body><table style="width:100%;border-collapse:collapse;font-size:13px">
<tr style="border-bottom:1px solid var(--rule)"><td class="lb" style="padding:7px 0;width:38%">--text-body</td><td class="hx">= --ink</td><td><span style="display:inline-block;width:14px;height:14px;border-radius:4px;background:var(--text-body);vertical-align:middle"></span></td><td class="p">reading text</td></tr>
<tr style="border-bottom:1px solid var(--rule)"><td class="lb" style="padding:7px 0">--text-muted</td><td class="hx">= --muted</td><td><span style="display:inline-block;width:14px;height:14px;border-radius:4px;background:var(--text-muted)"></span></td><td class="p">meta, captions</td></tr>
<tr style="border-bottom:1px solid var(--rule)"><td class="lb" style="padding:7px 0">--surface-band</td><td class="hx">= --band</td><td><span style="display:inline-block;width:14px;height:14px;border-radius:4px;background:var(--surface-band);border:1px solid var(--rule)"></span></td><td class="p">section stripe</td></tr>
<tr style="border-bottom:1px solid var(--rule)"><td class="lb" style="padding:7px 0">--border-default</td><td class="hx">= --rule</td><td><span style="display:inline-block;width:14px;height:14px;border-radius:4px;background:var(--border-default)"></span></td><td class="p">the 1px hairline</td></tr>
<tr style="border-bottom:1px solid var(--rule)"><td class="lb" style="padding:7px 0">--action-primary</td><td class="hx">= --accent</td><td><span style="display:inline-block;width:14px;height:14px;border-radius:4px;background:var(--action-primary)"></span></td><td class="p">the filled pill</td></tr>
<tr><td class="lb" style="padding:7px 0">--shadow-lift</td><td class="hx">= --lift</td><td></td><td class="p">a surface responding in place</td></tr>
</table></body></html>
