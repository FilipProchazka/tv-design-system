<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow:hidden}
.slide{position:relative;width:1920px;height:1080px;overflow:hidden;
  background:var(--surface);color:var(--ink);
  -webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.a{position:absolute}

/* ── themes ─────────────────────────────────────────────────────────
   Sampled from her own Canva decks. Every muted/soft value clears 4.5:1
   on its surface, every accent clears 4.5:1, so a theme swap can never
   quietly break legibility.                                            */
.t-petrol.light{--surface:#FFFFFF;--ink:#14211F;--muted:#5C6C69;--soft:#687672;--rule:#C2D0CD;--accent:#0B6A63;--onacc:#FFFFFF}
.t-petrol.dark {--surface:#0E3A36;--ink:#FFFFFF;--muted:#9CBCB6;--soft:#93B5AF;--rule:#2E5F59;--accent:#8FE3D9;--onacc:#0E3A36}
.t-violet.light{--surface:#FBF5FE;--ink:#401252;--muted:#6B4B7D;--soft:#7C5E8D;--rule:#CDB3DC;--accent:#6D2A8C;--onacc:#FFFFFF}
.t-violet.dark {--surface:#401252;--ink:#FFFFFF;--muted:#C9AEDA;--soft:#B49BC6;--rule:#5E2E73;--accent:#D8A6F5;--onacc:#401252}
.t-blue.light  {--surface:#FFFFFF;--ink:#0F2C47;--muted:#4A6884;--soft:#5C7890;--rule:#AFC4D6;--accent:#1D5994;--onacc:#FFFFFF}
.t-blue.dark   {--surface:#0F3557;--ink:#FFFFFF;--muted:#A6C2DB;--soft:#8CA9C4;--rule:#2A5480;--accent:#8FC9F5;--onacc:#0F3557}

/* legacy aliases: the original boards were written before themes existed */
.paper {--surface:#FFFFFF;--ink:#14211F;--muted:#5C6C69;--soft:#687672;--rule:#C2D0CD;--accent:#0B6A63;--onacc:#FFFFFF}
.petrol{--surface:#0E3A36;--ink:#FFFFFF;--muted:#9CBCB6;--soft:#93B5AF;--rule:#2E5F59;--accent:#8FE3D9;--onacc:#0E3A36}

/* type scale: six sizes, no more. Claim to body is 2.9x so it carries a room. */
.statement{font-family:Manrope,system-ui,sans-serif;font-weight:300;font-size:102px;line-height:1.06;letter-spacing:-.028em}
.claim    {font-family:Manrope,system-ui,sans-serif;font-weight:400;font-size:74px;line-height:1.11;letter-spacing:-.024em}
.sub      {font-family:Manrope,system-ui,sans-serif;font-weight:400;font-size:34px;line-height:1.22;letter-spacing:-.010em}
.lead     {font-family:Inter,system-ui,sans-serif;font-weight:400;font-size:30px;line-height:1.50;letter-spacing:-.004em}
.body     {font-family:Inter,system-ui,sans-serif;font-weight:400;font-size:26px;line-height:1.56;letter-spacing:-.002em}
.mono     {font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-weight:500;font-size:19px;line-height:1;letter-spacing:.13em;text-transform:uppercase}
.num      {font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-weight:400;font-size:20px;line-height:1.4;letter-spacing:.02em}
.figure   {font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-weight:400;line-height:.92;letter-spacing:-.045em;white-space:nowrap}

.muted{color:var(--muted)}
.acc  {color:var(--accent)}
.soft {color:var(--soft)}
.ink  {color:var(--ink);font-weight:600}

/* ── Instagram reels · 1080×1920 ────────────────────────────────────
   Two different rules, and conflating them is what makes a reel look
   unfinished:
     · SAFE TEXT ZONE  x 80–960, y 280–1250. Critical words go here so
       Instagram's own chrome never covers them.
     · THE FRAME       0–1080, 0–1920, and it must be FILLED. The chrome
       overlays content, it does not require blank space. A background
       always bleeds to all four edges.
   At 1080 wide on a ~390pt phone, 1px ≈ 0.36pt, so a 150px hook reads
   at ~54pt and 48px body at ~17pt. Anything smaller is fine print.    */
.reel{width:1080px;height:1920px}
.a-hook {font-family:Manrope,system-ui,sans-serif;font-weight:500;font-size:150px;line-height:.98;letter-spacing:-.038em}
.a-quote{font-family:Manrope,system-ui,sans-serif;font-weight:400;font-size:112px;line-height:1.06;letter-spacing:-.032em}
.a-mid  {font-family:Manrope,system-ui,sans-serif;font-weight:500;font-size:92px;line-height:1.08;letter-spacing:-.028em}
.a-sub  {font-family:Manrope,system-ui,sans-serif;font-weight:300;font-size:62px;line-height:1.14;color:var(--muted)}
.a-h    {font-family:Manrope,system-ui,sans-serif;font-weight:600;font-size:56px;line-height:1.16}
.a-body {font-family:Inter,system-ui,sans-serif;font-weight:400;font-size:48px;line-height:1.38;color:var(--muted)}
.a-fig  {font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:400;font-size:380px;line-height:.86;letter-spacing:-.05em;color:var(--accent);white-space:nowrap}
.a-mono {font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:500;font-size:32px;letter-spacing:.05em;color:var(--muted)}
.a-kick {font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:500;font-size:34px;letter-spacing:.12em;text-transform:uppercase}
/* emphasis, which social copy needs and a lecture slide does not */
.hl{color:var(--accent)}
.hlb{background:var(--accent);color:var(--onacc);padding:.02em .16em;
     box-decoration-break:clone;-webkit-box-decoration-break:clone}

  a{color:#0B6A63} a:hover{color:#08514C}
  </style>
</helmet>
<div class="slide t-blue light">

  <div class="a num muted" style="left:1240px;top:214px;width:560px;text-align:right;
    font-size:18px;letter-spacing:.04em;line-height:1.75">Zařazení je autorské, ne konsenzuální.</div>
  <svg class="a" style="left:0;top:0" width="1920" height="1080"><line x1="440" y1="330" x2="440" y2="852" style="stroke:var(--muted);stroke-width:2"></line>
   <line x1="440" y1="852" x2="1590" y2="852" style="stroke:var(--muted);stroke-width:2"></line>
   <line x1="1000" y1="330" x2="1000" y2="852" style="stroke:var(--rule);stroke-width:1"></line>
   <line x1="440" y1="606" x2="1590" y2="606" style="stroke:var(--rule);stroke-width:1"></line><text x="1590" y="900" text-anchor="end"
    style="fill:var(--muted);font-family:'JetBrains Mono';font-weight:400;font-size:22px;letter-spacing:0.08em">Jak dobře je to doloženo</text><g transform="translate(398 852) rotate(-90)"><text x="0" y="0" text-anchor="start"
    style="fill:var(--muted);font-family:'JetBrains Mono';font-weight:400;font-size:20px;letter-spacing:0.08em">Velikost efektu</text></g><circle cx="1425.6" cy="389.5" r="15" style="fill:var(--accent)"></circle><text x="1397.6" y="397.52000000000004" text-anchor="end"
    style="fill:var(--ink);font-family:Inter;font-weight:500;font-size:26px;letter-spacing:0em">Energetická dostupnost</text><circle cx="1403.2" cy="547.0" r="15" style="fill:var(--accent)"></circle><text x="1375.1999999999998" y="554.96" text-anchor="end"
    style="fill:var(--ink);font-family:Inter;font-weight:500;font-size:26px;letter-spacing:0em">Bílkoviny 1,2–1,6&nbsp;g/kg</text><circle cx="1268.8" cy="655.2" r="15" style="fill:var(--accent)"></circle><text x="1240.8" y="663.2" text-anchor="end"
    style="fill:var(--ink);font-family:Inter;font-weight:500;font-size:26px;letter-spacing:0em">Kreatin monohydrát</text><circle cx="731.2" cy="753.6" r="15" style="fill:var(--rule)"></circle><text x="759.2" y="761.6" text-anchor="start"
    style="fill:var(--muted);font-family:Inter;font-weight:400;font-size:26px;letter-spacing:0em">Načasování podle fází</text><circle cx="552.0" cy="817.6" r="15" style="fill:var(--rule)"></circle><text x="580" y="825.56" text-anchor="start"
    style="fill:var(--muted);font-family:Inter;font-weight:400;font-size:26px;letter-spacing:0em">„Proestrogenní“ potraviny</text></svg></div>
</x-dc>
</body>
</html>
